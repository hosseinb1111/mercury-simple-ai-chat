<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Mercury Chat</title>
<style>
:root{--bg:#0f1115;--panel:#171a21;--line:#262b36;--text:#e6e8ec;--muted:#8a93a6;--user:#1f6feb;--accent:#58a6ff;--danger:#f85149;--code:#0b0d12}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:15px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line)}
header h1{font-size:16px;margin:0;flex:1}
.badge{font-size:12px;color:var(--muted)}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:8px;padding:8px 12px}
button:hover:not(:disabled){border-color:var(--accent)}
button:disabled{opacity:.5;cursor:default}
button.primary{background:var(--accent);border-color:var(--accent);color:#06121f;font-weight:600}
button.rec{color:var(--danger);border-color:var(--danger)}
#log{flex:1;overflow-y:auto;padding:20px 16px}
.wrap{max-width:820px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.empty{color:var(--muted);text-align:center;margin-top:14vh}
.msg{padding:10px 14px;border-radius:12px;max-width:100%;overflow-wrap:anywhere}
.msg.user{align-self:flex-end;max-width:85%;background:var(--user);color:#fff;white-space:pre-wrap}
.msg.bot{align-self:stretch;background:var(--panel);border:1px solid var(--line)}
.msg.bot.error{border-color:var(--danger);color:#ffb4ae}
.msg.bot pre{background:var(--code);padding:10px;border-radius:8px;overflow-x:auto}
.msg.bot code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px}
.msg.bot :not(pre)>code{background:var(--code);padding:1px 5px;border-radius:4px}
.msg.bot table{border-collapse:collapse;display:block;overflow-x:auto}
.msg.bot th,.msg.bot td{border:1px solid var(--line);padding:6px 8px}
.msg.bot blockquote{margin:0;padding-left:12px;border-left:3px solid var(--line);color:var(--muted)}
.msg.bot > :first-child{margin-top:0}.msg.bot > :last-child{margin-bottom:0}
.status{color:var(--muted);font-size:13px}
footer{border-top:1px solid var(--line);padding:12px 16px}
.bar{max-width:820px;margin:0 auto}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.chips:empty{display:none}
.chip{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:4px 6px 4px 10px;font-size:13px;display:flex;gap:6px;align-items:center}
.chip button{padding:0 6px;border:0;background:none;color:var(--muted)}
.row{display:flex;gap:8px;align-items:flex-end}
textarea{flex:1;resize:none;min-height:44px;max-height:200px;font:inherit;color:var(--text);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
textarea:focus{outline:none;border-color:var(--accent)}
.note{color:var(--muted);font-size:13px;margin-top:8px;text-align:center;min-height:1em}
</style>
</head>
<body>
<header>
  <h1 id="title">Mercury Chat</h1>
  <span class="badge" id="model"></span>
  <button id="newChat" title="Start over. Nothing is saved.">New chat</button>
</header>

<main id="log">
  <div class="wrap" id="wrap">
    <div class="empty">Ask anything. Nothing is saved: refreshing the page starts a fresh chat.</div>
  </div>
</main>

<footer>
  <div class="bar">
    <div class="chips" id="chips"></div>
    <div class="row">
      <button id="attach" title="Attach an image or a document" hidden>📎</button>
      <input type="file" id="file" hidden accept="image/*,.pdf,.docx,.xlsx,.xls,.csv,.html,.htm,.txt,.md,.json,.xml">
      <button id="mic" title="Record a voice message" hidden>🎙</button>
      <textarea id="input" rows="1" placeholder="Message…"></textarea>
      <button id="send" class="primary">Send</button>
      <button id="stop" hidden>Stop</button>
    </div>
    <div class="note" id="note"></div>
  </div>
</footer>

<!-- Markdown rendering. If these CDN scripts fail, replies are shown as plain text. -->
<script src="https://cdn.jsdelivr.net/npm/marked@15.0.12/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.4/dist/purify.min.js"></script>
<script>
const $ = (id) => document.getElementById(id);
const TEXT_EXT = new Set(["txt", "md", "csv", "json", "xml", "html", "htm", "log"]);
const FILE_CHARS = 40000;
// The whole conversation lives only in this variable. It is never written to storage.
const state = { history: [], pending: [], busy: false, abort: null, recorder: null, maxMb: 10, gen: 0 };

const hasMd = typeof marked !== "undefined" && typeof DOMPurify !== "undefined";
if (hasMd) {
  DOMPurify.addHook("afterSanitizeAttributes", (node) => {
    if (node.tagName === "A") { node.setAttribute("target", "_blank"); node.setAttribute("rel", "noopener noreferrer"); }
  });
}

const note = (text) => { $("note").textContent = text; };
const scrollDown = () => { const log = $("log"); log.scrollTop = log.scrollHeight; };

function setBot(el, text) {
  if (hasMd) el.innerHTML = DOMPurify.sanitize(marked.parse(text, { gfm: true, breaks: true }));
  else el.textContent = text;
}

function addMsg(role, text = "") {
  $("wrap").querySelector(".empty")?.remove();
  const el = document.createElement("div");
  el.className = `msg ${role}`;
  if (role === "bot") setBot(el, text); else el.textContent = text;
  $("wrap").appendChild(el);
  scrollDown();
  return el;
}

async function loadConfig() {
  const c = await fetch("/api/config").then((r) => r.json()).catch(() => null);
  if (!c) return note("Could not reach the server.");
  document.title = c.title;
  $("title").textContent = c.title;
  $("model").textContent = c.model;
  state.maxMb = c.maxUploadMb;
  const canRecord = Boolean(navigator.mediaDevices?.getUserMedia && window.MediaRecorder);
  $("attach").hidden = !c.features.ai;
  $("mic").hidden = !(c.features.ai && canRecord);
  if (!c.configured) note("⚠️ The server has no INCEPTION_API_KEY. Add it and redeploy.");
}

function renderChips() {
  const bar = $("chips");
  bar.innerHTML = "";
  state.pending.forEach((a, i) => {
    const chip = document.createElement("span");
    chip.className = "chip";
    chip.textContent = `${a.kind === "image" ? "🖼" : "📄"} ${a.name}`;
    const x = document.createElement("button");
    x.textContent = "✕";
    x.title = "Remove";
    x.onclick = () => { state.pending.splice(i, 1); renderChips(); };
    chip.appendChild(x);
    bar.appendChild(chip);
  });
}

/* ---------- attachments ---------- */

async function imageToJpeg(file) {
  const bitmap = await createImageBitmap(file);
  const scale = Math.min(1, 1600 / Math.max(bitmap.width, bitmap.height));
  const canvas = document.createElement("canvas");
  canvas.width = Math.round(bitmap.width * scale);
  canvas.height = Math.round(bitmap.height * scale);
  canvas.getContext("2d").drawImage(bitmap, 0, 0, canvas.width, canvas.height);
  return canvas.toDataURL("image/jpeg", 0.9).split(",")[1];
}

async function readDoc(file) {
  const ext = file.name.split(".").pop().toLowerCase();
  if (TEXT_EXT.has(ext)) return (await file.text()).slice(0, FILE_CHARS);
  const res = await fetch("/api/convert", {
    method: "POST",
    headers: { "content-type": file.type || "application/octet-stream", "x-file-name": encodeURIComponent(file.name) },
    body: file,
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || "File conversion failed.");
  return data.markdown;
}

$("attach").onclick = () => $("file").click();
$("file").onchange = async (e) => {
  const file = e.target.files[0];
  e.target.value = "";
  if (!file) return;
  if (file.size > state.maxMb * 1024 * 1024) return note(`That file is too large (max ${state.maxMb} MB).`);
  try {
    if (file.type.startsWith("image/")) {
      state.pending = state.pending.filter((a) => a.kind !== "image"); // one image at a time
      note("Preparing image…");
      state.pending.push({ kind: "image", name: file.name, mime: "image/jpeg", b64: await imageToJpeg(file) });
    } else {
      note("Converting file…");
      state.pending.push({ kind: "doc", name: file.name, text: await readDoc(file) });
    }
    note("");
    renderChips();
  } catch (err) {
    note(err.message);
  }
};

/* ---------- voice ---------- */

function blobToBase64(blob) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(String(reader.result).split(",")[1]);
    reader.onerror = () => reject(new Error("Could not read the recording."));
    reader.readAsDataURL(blob);
  });
}

async function toggleMic() {
  if (state.recorder) return state.recorder.stop();
  if (state.busy) return note("Wait for the current answer, or press Stop.");
  let stream;
  try {
    stream = await navigator.mediaDevices.getUserMedia({ audio: true });
  } catch {
    return note("Microphone access was denied.");
  }
  const recorder = new MediaRecorder(stream);
  const chunks = [];
  let timer = null;
  recorder.ondataavailable = (e) => { if (e.data.size) chunks.push(e.data); };
  recorder.onstop = async () => {
    clearTimeout(timer);
    stream.getTracks().forEach((t) => t.stop());
    state.recorder = null;
    $("mic").classList.remove("rec");
    await transcribeAndSend(new Blob(chunks, { type: recorder.mimeType || "audio/webm" }));
  };
  recorder.start();
  state.recorder = recorder;
  $("mic").classList.add("rec");
  timer = setTimeout(() => { if (recorder.state === "recording") recorder.stop(); }, 120000);
  note("Recording… tap 🎙 again to stop (2 minutes max).");
}

async function transcribeAndSend(blob) {
  note("Transcribing…");
  try {
    const res = await fetch("/api/transcribe", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ audio: await blobToBase64(blob) }),
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || "Transcription failed.");
    note("");
    await send(data.text, { voice: true });
  } catch (err) {
    note(err.message);
  }
}

/* ---------- chat ---------- */

async function streamAnswer(bubble) {
  const controller = new AbortController();
  const gen = state.gen; // bumped by "New chat", so a late answer never lands in a fresh chat
  state.abort = controller;
  let full = "", stopped = false;
  bubble.innerHTML = '<span class="status">Thinking…</span>';
  try {
    const res = await fetch("/api/chat", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ messages: state.history }),
      signal: controller.signal,
    });
    if (!res.ok) {
      const data = await res.json().catch(() => ({}));
      throw new Error(data.error || `Request failed (${res.status}).`);
    }
    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buffer = "";
    for (;;) {
      const { value, done } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      let nl;
      while ((nl = buffer.indexOf("\n")) >= 0) {
        const line = buffer.slice(0, nl).trim();
        buffer = buffer.slice(nl + 1);
        if (!line.startsWith("data:")) continue;
        const data = line.slice(5).trim();
        if (!data || data === "[DONE]") continue;
        let delta = "";
        try { delta = JSON.parse(data).choices?.[0]?.delta?.content || ""; } catch { /* ignore keep-alives */ }
        if (delta) {
          full += delta;
          setBot(bubble, full);
          scrollDown();
        }
      }
    }
  } catch (err) {
    if (err.name !== "AbortError") throw err;
    stopped = true;
  } finally {
    state.abort = null;
  }
  if (gen !== state.gen) return;
  if (!full) {
    if (!stopped) throw new Error("The model returned an empty answer.");
    bubble.textContent = "Stopped.";
    if (state.history.at(-1)?.role === "user") state.history.pop();
    return;
  }
  if (stopped) note("Stopped.");
  state.history.push({ role: "assistant", content: full });
}

async function describeImage(image, prompt, bubble) {
  bubble.innerHTML = '<span class="status">Looking at the image…</span>';
  const res = await fetch("/api/describe", {
    method: "POST",
    headers: { "content-type": "application/json" },
    body: JSON.stringify({ image: image.b64, mime: image.mime, prompt }),
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || "Image analysis failed.");
  setBot(bubble, data.text);
  state.history.push({ role: "assistant", content: data.text });
}

async function send(raw, opts = {}) {
  if (state.busy) return note("Still answering the previous message.");
  const text = raw.trim();
  const attachments = state.pending.splice(0);
  if (!text && !attachments.length) return;
  renderChips();

  state.busy = true;
  $("send").disabled = true;
  $("stop").hidden = false;
  note("");

  const image = attachments.find((a) => a.kind === "image");
  const docs = attachments.filter((a) => a.kind === "doc");
  let content = text || (image ? "Describe this image in detail." : "Analyze the attached file.");
  for (const d of docs) content += `\n\n--- File: ${d.name} ---\n${d.text}`;
  if (image) content += `\n\n[Image attached: ${image.name}]`;

  const label = [opts.voice ? `🎙 ${text}` : text, ...attachments.map((a) => `📎 ${a.name}`)]
    .filter(Boolean)
    .join("\n");
  addMsg("user", label);
  state.history.push({ role: "user", content });
  const bubble = addMsg("bot", "");

  try {
    if (image) await describeImage(image, text || "Describe this image in detail.", bubble);
    else await streamAnswer(bubble);
  } catch (err) {
    bubble.className = "msg bot error";
    bubble.textContent = err.message || "Something went wrong.";
    if (state.history.at(-1)?.role === "user") state.history.pop(); // keep history consistent for a retry
  } finally {
    state.busy = false;
    $("send").disabled = false;
    $("stop").hidden = true;
  }
}

function submit() {
  if (state.busy) return;
  const value = $("input").value;
  if (!value.trim() && !state.pending.length) return;
  $("input").value = "";
  $("input").style.height = "auto";
  send(value);
}

const input = $("input");
input.addEventListener("input", () => {
  input.style.height = "auto";
  input.style.height = Math.min(input.scrollHeight, 200) + "px";
});
input.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey && !e.isComposing) {
    e.preventDefault();
    submit();
  }
});
$("send").onclick = submit;
$("mic").onclick = toggleMic;
$("stop").onclick = () => state.abort?.abort();
$("newChat").onclick = () => {
  state.abort?.abort();
  state.gen++;
  state.history = [];
  state.pending = [];
  renderChips();
  note("");
  $("wrap").innerHTML = '<div class="empty">New chat. Nothing from the previous conversation is kept.</div>';
};

loadConfig();
</script>
</body>
</html>

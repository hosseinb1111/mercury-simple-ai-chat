name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Installs Wrangler 4 from package.json.
      - name: Install dependencies
        run: npm install

      # Step 1: deploy the Worker. This creates it on the first run.
      - name: Deploy Worker
        run: npx wrangler deploy

      # Step 2: store the API key. It runs after the deploy because the Worker must exist first.
      - name: Set INCEPTION_API_KEY secret
        run: echo "$INCEPTION_API_KEY" | npx wrangler secret put INCEPTION_API_KEY
        env:
          INCEPTION_API_KEY: ${{ secrets.INCEPTION_API_KEY }}
